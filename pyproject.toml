[project]
name = "bricktally"
version = "0.1.0"
description = "Count a same-part LEGO pile by BrickLink color and export BrickStore BSX."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8",
  "PySide6>=6.6",
  "requests>=2.31",
  "platformdirs>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "updater"]

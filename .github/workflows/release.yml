name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        shell: cmd
        run: call build_windows.bat

      - name: Zip and checksum
        shell: pwsh
        run: |
          if (Test-Path dist\BrickTally-windows.zip) { Remove-Item dist\BrickTally-windows.zip }
          Compress-Archive -Path dist\BrickTally -DestinationPath dist\BrickTally-windows.zip
          $hash = (Get-FileHash dist\BrickTally-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BrickTally-windows.zip" | Out-File -Encoding ascii dist\BrickTally-windows.zip.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BrickTally-windows.zip
            dist/BrickTally-windows.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
